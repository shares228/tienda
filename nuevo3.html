<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teclado Polifónico</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101010;
    color: white;
    font-family: Arial, sans-serif;
}

.contenedor {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

h1 {
    text-align: center;
}

.panel {
    background: #1b1b1b;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
}

.botones {
    text-align: center;
}

button {
    border: none;
    border-radius: 8px;
    padding: 12px 20px;
    margin: 5px;
    font-size: 16px;
    cursor: pointer;
}

#cargar {
    background: #3498db;
    color: white;
}

#parar {
    background: #e74c3c;
    color: white;
}

#limpiar {
    background: #555;
    color: white;
}

.control {
    margin: 15px 0;
}

.control label {
    display: block;
    margin-bottom: 8px;
}

input[type="range"] {
    width: 100%;
}

.valor {
    color: #2ecc71;
    font-weight: bold;
}


/* =====================================
   TECLADO
===================================== */

#teclado {

    display: grid;

    grid-template-columns:
        repeat(auto-fill, minmax(110px, 1fr));

    gap: 10px;

    margin-top: 20px;
}


.nota {

    position: relative;

    min-height: 100px;

    background: linear-gradient(
        #eeeeee,
        #cccccc
    );

    color: #111;

    border-radius: 10px;

    border: 2px solid #888;

    display: flex;

    justify-content: center;

    align-items: center;

    text-align: center;

    cursor: pointer;

    user-select: none;

    transition: .1s;

    font-weight: bold;

}


.nota:hover {

    transform: translateY(-2px);

}


.nota.seleccionada {

    background: #2ecc71;

    color: white;

    border-color: #8affb0;

    box-shadow:
        0 0 20px
        rgba(46,204,113,.7);

}


.nota.sonando {

    background: #f1c40f;

    color: black;

    transform: scale(.96);

    box-shadow:
        0 0 30px
        rgba(241,196,15,.9);

}


.numero {

    position: absolute;

    top: 5px;

    left: 7px;

    font-size: 12px;

    opacity: .6;

}


.nombre {

    padding: 5px;

    word-break: break-word;

}


#estado {

    text-align: center;

    font-size: 18px;

    margin: 15px;

}


#seleccion {

    background: #111;

    border-radius: 10px;

    padding: 15px;

    min-height: 50px;

    color: #2ecc71;

}

</style>
</head>


<body>


<div class="contenedor">

    <h1>🎹 Teclado Polifónico</h1>


    <!-- =====================================
         CONTROLES
    ====================================== -->

    <div class="panel">

        <div class="botones">

            <button id="cargar">
                📁 Cargar carpeta
            </button>

            <button id="parar">
                ⏹ Parar
            </button>

            <button id="limpiar">
                🧹 Limpiar selección
            </button>

        </div>


        <div class="control">

            <label>

                Duración de la nota:

                <span
                    id="duracionTexto"
                    class="valor"
                >
                    1.00 s
                </span>

            </label>

            <input
                id="duracion"
                type="range"
                min="0.05"
                max="10"
                step="0.05"
                value="1"
            >

        </div>


        <div class="control">

            <label>

                Volumen:

                <span
                    id="volumenTexto"
                    class="valor"
                >
                    100%
                </span>

            </label>

            <input
                id="volumen"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1"
            >

        </div>

    </div>


    <!-- =====================================
         ESTADO
    ====================================== -->

    <div id="estado">
        Selecciona una carpeta de sonidos.
    </div>


    <!-- =====================================
         SELECCIÓN
    ====================================== -->

    <div class="panel">

        <strong>
            Notas seleccionadas:
        </strong>

        <div id="seleccion">
            Ninguna
        </div>

    </div>


    <!-- =====================================
         TECLADO
    ====================================== -->

    <div class="panel">

        <div id="teclado"></div>

    </div>

</div>


<script>

/* =========================================
   VARIABLES
========================================= */

let archivos = [];

let seleccionadas = [];

let sonidosActivos = [];


/* =========================================
   ELEMENTOS
========================================= */

const cargar =
    document.getElementById("cargar");

const parar =
    document.getElementById("parar");

const limpiar =
    document.getElementById("limpiar");

const teclado =
    document.getElementById("teclado");

const duracion =
    document.getElementById("duracion");

const volumen =
    document.getElementById("volumen");

const estado =
    document.getElementById("estado");

const seleccion =
    document.getElementById("seleccion");


/* =========================================
   CONTROLES
========================================= */

duracion.addEventListener(
    "input",
    () => {

        document.getElementById(
            "duracionTexto"
        ).textContent =
            Number(
                duracion.value
            ).toFixed(2) + " s";

    }
);


volumen.addEventListener(
    "input",
    () => {

        document.getElementById(
            "volumenTexto"
        ).textContent =
            Math.round(
                volumen.value * 100
            ) + "%";

    }
);


/* =========================================
   CARGAR TODA LA CARPETA
========================================= */

cargar.addEventListener(
    "click",
    async () => {

        try {

            const carpeta =
                await window.showDirectoryPicker();


            archivos = [];


            /*
             * Buscar TODOS los archivos
             * de sonido de la carpeta
             */

            for await (
                const entrada
                of carpeta.values()
            ) {

                if (
                    entrada.kind !== "file"
                ) {
                    continue;
                }


                const nombre =
                    entrada.name.toLowerCase();


                if (

                    nombre.endsWith(".wav") ||

                    nombre.endsWith(".mp3") ||

                    nombre.endsWith(".ogg") ||

                    nombre.endsWith(".m4a") ||

                    nombre.endsWith(".webm") ||

                    nombre.endsWith(".aac") ||

                    nombre.endsWith(".flac")

                ) {

                    archivos.push(
                        entrada
                    );

                }

            }


            /*
             * Ordenar archivos
             */

            archivos.sort(
                (a, b) =>
                    a.name.localeCompare(
                        b.name,
                        undefined,
                        {
                            numeric: true
                        }
                    )
            );


            mostrarTeclado();


            estado.textContent =
                archivos.length +
                " sonidos cargados.";

        }

        catch(error) {

            console.error(error);

            estado.textContent =
                "No se seleccionó la carpeta.";

        }

    }
);


/* =========================================
   CREAR BOTONES
========================================= */

function mostrarTeclado() {

    teclado.innerHTML = "";


    archivos.forEach(
        (archivo, indice) => {


            const boton =
                document.createElement(
                    "div"
                );


            boton.className =
                "nota";


            boton.dataset.indice =
                indice;


            boton.innerHTML = `

                <span class="numero">
                    ${indice + 1}
                </span>

                <span class="nombre">
                    ${archivo.name}
                </span>

            `;


            /*
             * CLICK
             */

            boton.addEventListener(
                "click",
                () => {

                    seleccionarNota(
                        indice,
                        boton
                    );

                }
            );


            teclado.appendChild(
                boton
            );

        }
    );

}


/* =========================================
   SELECCIONAR / DESELECCIONAR
========================================= */

function seleccionarNota(
    indice,
    boton
) {


    /*
     * Si ya está seleccionada
     * la quitamos
     */

    if (
        seleccionadas.includes(
            indice
        )
    ) {

        seleccionadas =
            seleccionadas.filter(
                i => i !== indice
            );


        boton.classList.remove(
            "seleccionada"
        );

        actualizarSeleccion();

        return;

    }


    /*
     * Añadir a la selección
     */

    seleccionadas.push(
        indice
    );


    boton.classList.add(
        "seleccionada"
    );


    actualizarSeleccion();


    /*
     * REPRODUCIR INMEDIATAMENTE
     */

    reproducirNota(
        archivos[indice],
        indice
    );

}


/* =========================================
   ACTUALIZAR TEXTO
========================================= */

function actualizarSeleccion() {

    if (
        seleccionadas.length === 0
    ) {

        seleccion.textContent =
            "Ninguna";

        return;

    }


    seleccion.innerHTML =
        seleccionadas
            .map(
                indice =>
                    archivos[indice].name
            )
            .join("  +  ");

}


/* =========================================
   REPRODUCIR NOTA
========================================= */

async function reproducirNota(
    archivo,
    indice
) {

    try {

        const file =
            await archivo.getFile();


        const url =
            URL.createObjectURL(
                file
            );


        const audio =
            new Audio(url);


        audio.volume =
            Number(
                volumen.value
            );


        /*
         * Guardar para poder
         * detenerlo después
         */

        sonidosActivos.push(
            audio
        );


        const boton =
            document.querySelector(
                `.nota[data-indice="${indice}"]`
            );


        if (boton) {

            boton.classList.add(
                "sonando"
            );

        }


        await audio.play();


        /*
         * Duración configurada
         */

        const tiempo =
            Number(
                duracion.value
            ) * 1000;


        setTimeout(
            () => {


                audio.pause();

                audio.currentTime = 0;


                URL.revokeObjectURL(
                    url
                );


                if (boton) {

                    boton.classList.remove(
                        "sonando"
                    );

                }


                const posicion =
                    sonidosActivos.indexOf(
                        audio
                    );


                if (
                    posicion !== -1
                ) {

                    sonidosActivos.splice(
                        posicion,
                        1
                    );

                }

            },
            tiempo
        );


    }

    catch(error) {

        console.error(
            "Error:",
            error
        );

    }

}


/* =========================================
   PARAR TODOS LOS SONIDOS
========================================= */

parar.addEventListener(
    "click",
    () => {


        sonidosActivos.forEach(
            audio => {

                try {

                    audio.pause();

                    audio.currentTime = 0;

                }

                catch(error) {}

            }
        );


        sonidosActivos = [];


        document
            .querySelectorAll(".nota")
            .forEach(
                boton => {

                    boton.classList.remove(
                        "sonando"
                    );

                }
            );


        estado.textContent =
            "Todos los sonidos detenidos.";

    }
);


/* =========================================
   LIMPIAR SELECCIÓN
========================================= */

limpiar.addEventListener(
    "click",
    () => {


        seleccionadas = [];


        document
            .querySelectorAll(".nota")
            .forEach(
                boton => {

                    boton.classList.remove(
                        "seleccionada"
                    );

                }
            );


        actualizarSeleccion();


        estado.textContent =
            "Selección limpiada.";

    }
);

</script>

</body>
</html>
